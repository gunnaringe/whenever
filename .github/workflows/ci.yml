name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle the Worker
        run: npx wrangler deploy --dry-run --outdir /tmp/worker
      # Who may do what, against the Worker running here (test/api).
      - name: API tests
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 --var MAIL_ECHO:1 > /tmp/wrangler-dev.log 2>&1 &
          curl -s -o /dev/null --retry 60 --retry-connrefused --retry-delay 1 http://127.0.0.1:8787/ || { cat /tmp/wrangler-dev.log; exit 1; }
          BASE=http://127.0.0.1:8787 npm run test:api
