name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle the Worker
        run: npx wrangler deploy --dry-run --outdir /tmp/worker
      # Who may do what, against the Worker running here (test/api).
      - name: API tests
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 --var MAIL_ECHO:1 > /tmp/wrangler-dev.log 2>&1 &
          curl -s -o /dev/null --retry 60 --retry-connrefused --retry-delay 1 http://127.0.0.1:8787/ || { cat /tmp/wrangler-dev.log; exit 1; }
          BASE=http://127.0.0.1:8787 npm run test:api
