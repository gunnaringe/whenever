# Once a month: one pull request for the npm packages (all of them dev tools;
# the app has no runtime dependencies) and one for the GitHub Actions, which
# ci.yml pins to commits.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
